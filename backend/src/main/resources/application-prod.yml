server:
  port: 8080
  shutdown: graceful

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cipherlens}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.dre4m1nd.cipherlens.model.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

# 生产环境默认关闭接口文档（需要时设 API_DOCS_ENABLED=true）
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

knife4j:
  enable: ${API_DOCS_ENABLED:false}

huawei:
  ak: ${HUAWEI_AK:}
  sk: ${HUAWEI_SK:}

token:
  secret-key: ${TOKEN_SECRET_KEY:change-me-in-production}

logging:
  file:
    name: /app/logs/cipherlens.log
