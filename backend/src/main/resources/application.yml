server:
  port: 8080

spring:
  profiles:
    active: dev
  # 通用 Redis/MySQL 连接池基础配置
  data:
    redis:
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 10000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml

logging:
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: /app/logs/cipherlens-%d{yyyy-MM-dd}.%i.log
