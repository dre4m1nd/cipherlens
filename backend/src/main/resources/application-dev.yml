spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cipherlens?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.dre4m1nd.cipherlens.model.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'user-api'
      paths-to-match: '/**'
      packages-to-scan: com.dre4m1nd.cipherlens.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

# 华为云 KMS：本地开发不配 AK/SK 时，注册/密码解密相关功能不可用
huawei:
  ak:
  sk:
  kms:
    key-id: fe7c0e06-381f-4d29-be61-f161e2d67225
    region: cn-south-1
    algorithm: RSAES_OAEP_SHA_256

# 加密相关配置
crypto:
  rsa:
    # RSA-4096 公钥（Base64，对应华为云 KMS 密钥对），用于加密用户 AES 密钥
    public-key: ''

security:
  reset:
    # 本地未配置 SMTP 时，把找回密码验证码打印到日志（生产环境必须为 false）
    code-log-enabled: true

token:
  # 本地开发密钥，生产环境请用 TOKEN_SECRET_KEY 注入随机值
  secret-key: dev-token-secret-key-0123456789
